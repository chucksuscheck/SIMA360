<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" class="sima-diagram">
<title>SIMA360 framework diagram</title>
<style>
.sima-diagram a { cursor: pointer; }
.sima-diagram a:hover rect { opacity: 0.85; }
.sima-diagram a:focus-visible rect { outline: 2px solid #0C447C; outline-offset: 2px; }
</style>
<defs>
<marker id="sima-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"></path>
</marker>
</defs>

<rect x="20" y="20" width="580" height="380" rx="16" fill="none" stroke="#8a8a86" stroke-width="1.5" stroke-dasharray="5 4"></rect>
<text x="38" y="44" font-size="11" fill="#8a8a86">SIMA360</text>

<text x="310" y="12" text-anchor="middle" font-size="11" fill="#8a8a86">start here</text>
<path d="M310,16 L310,37" stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#sima-arrow)"></path>

<path d="M250,104 L145,188" stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#sima-arrow)"></path>
<path d="M370,104 L475,188" stroke="#6b6b66" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-dasharray="1 5" marker-end="url(#sima-arrow)"></path>
<text x="452" y="132" font-size="11" fill="#8a8a86">optional</text>
<path d="M195,254 L265,318" stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#sima-arrow)"></path>
<path d="M425,254 L355,318" stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#sima-arrow)"></path>

<path d="M385,345 C 560,345 585,280 585,220 C 585,160 560,95 385,80" stroke="#6b6b66" stroke-width="1.5" fill="none" marker-end="url(#sima-arrow)"></path>
<text x="555" y="218" text-anchor="end" font-size="11" fill="#8a8a86">next cycle</text>

<path d="M310,455 L310,400" stroke="#8a8a86" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#sima-arrow)"></path>
<text x="325" y="431" font-size="11" fill="#8a8a86">supports</text>

<a href="https://www.sima360.org/sima-probe" aria-label="Assess with SIMA-Probe">
<rect x="235" y="40" width="150" height="64" rx="4" fill="#E6F1FB"></rect>
<text x="310" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">Assess with</text>
<text x="310" y="86" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">SIMA-Probe</text>
</a>

<a href="https://www.sima360.org/sima-core" aria-label="Diagnose with SIMA-Core">
<rect x="50" y="190" width="170" height="64" rx="4" fill="#EEEDFE"></rect>
<text x="135" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Diagnose with</text>
<text x="135" y="236" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">SIMA-Core</text>
</a>

<a href="https://www.sima360.org/sima-kit" aria-label="Equip with SIMA-Kit">
<rect x="400" y="190" width="170" height="64" rx="4" fill="#FAECE7"></rect>
<text x="485" y="216" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Equip with</text>
<text x="485" y="236" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">SIMA-Kit</text>
</a>

<a href="https://www.sima360.org/sima-flow" aria-label="Improve with SIMA-Flow">
<rect x="235" y="320" width="150" height="64" rx="4" fill="#EAF3DE"></rect>
<text x="310" y="346" text-anchor="middle" font-size="14" font-weight="500" fill="#173404">Improve with</text>
<text x="310" y="366" text-anchor="middle" font-size="14" font-weight="500" fill="#173404">SIMA-Flow</text>
</a>

<a href="https://www.sima360.org/sima-ascend" aria-label="Consulting and Training with SIMA-Ascend">
<rect x="20" y="460" width="580" height="70" rx="4" fill="#E1F5EE"></rect>
<text x="310" y="490" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Consulting and Training</text>
<text x="310" y="512" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">with SIMA-Ascend</text>
</a>

</svg>
