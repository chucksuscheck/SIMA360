<svg viewBox="0 0 960 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SIMA360 Structured AI Maturity, compact version, linked</title>
<desc>Assess (SIMA-Probe), Diagnostics (SIMA-Core), Resources (SIMA-Kit), Improve (SIMA-Flow), and Consulting and Training (SIMA-Ascend) each link to their real page on sima360.org.</desc>
<defs>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
</marker>
</defs>

<style>
.box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; cursor: pointer; }
.box:hover { stroke: #3b82f6; stroke-width: 2; }
.boxAlt { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; cursor: pointer; }
.boxAlt:hover { stroke: #3b82f6; stroke-width: 2; }
.step-title { font: 700 15px Inter, sans-serif; fill: #0f172a; }
.step-sub { font: 400 11.5px Inter, sans-serif; fill: #475569; }
.step-label { font: 700 10px Inter, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
.bullet { font: 400 12px Inter, sans-serif; fill: #334155; }
.flow-line { stroke: #2563eb; stroke-width: 3.25; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
.eyebrow { font: 600 11px Inter, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
.support-title { font: 700 15px Inter, sans-serif; fill: #0f172a; }
.support-sub { font: 400 11.5px Inter, sans-serif; fill: #475569; }
.tag-optional { font: 700 9px Inter, sans-serif; fill: #64748b; letter-spacing: 0.04em; }
.divider { stroke: #e2e8f0; stroke-width: 1; }
.dashed { stroke-dasharray: 4 3; }
</style>

<rect x="0" y="0" width="960" height="760" fill="#ffffff"/>
<text class="eyebrow" x="40" y="26">SIMA360 STRUCTURED AI MATURITY</text>

<!-- Assess (links to sima-probe) -->
<a href="https://www.sima360.org/sima-probe">
<rect class="box" x="60" y="130" width="190" height="160" rx="8"/>
<text class="step-label" x="78" y="151">SIMA-PROBE</text>
<text class="step-title" x="78" y="171">Assess</text>
<line class="divider" x1="78" y1="181" x2="232" y2="181"/>
<text class="step-label" x="78" y="199">TIERS</text>
<text class="bullet" x="78" y="217">• Free</text>
<text class="bullet" x="78" y="235">• In Depth</text>
<text class="bullet" x="78" y="253">• AI Analyzed</text>
<text class="bullet" x="78" y="271">• Human Led</text>
</a>

<!-- Diagnostics (links to sima-core) -->
<a href="https://www.sima360.org/sima-core">
<rect class="box" x="380" y="130" width="190" height="195" rx="8"/>
<text class="step-label" x="398" y="151">SIMA-CORE</text>
<text class="step-title" x="398" y="171">Diagnostics</text>
<line class="divider" x1="398" y1="181" x2="552" y2="181"/>
<text class="step-label" x="398" y="199">PERSPECTIVES</text>
<text class="bullet" x="398" y="217">• Strategy</text>
<text class="bullet" x="398" y="235">• Governance</text>
<text class="bullet" x="398" y="253">• Data</text>
<text class="bullet" x="398" y="271">• People</text>
<text class="bullet" x="398" y="289">• Technology</text>
</a>

<!-- Resources (links to sima-kit) -->
<a href="https://www.sima360.org/sima-kit">
<rect class="box" x="700" y="130" width="190" height="160" rx="8"/>
<text class="step-label" x="718" y="151">SIMA-KIT</text>
<text class="step-title" x="718" y="171">Resources</text>
<rect class="dashed" x="805" y="159" width="66" height="16" fill="none" stroke="#94a3b8" stroke-width="1" rx="3"/>
<text class="tag-optional" x="812" y="170">OPTIONAL</text>
<line class="divider" x1="718" y1="181" x2="872" y2="181"/>
<text class="step-label" x="718" y="199">TIERS</text>
<text class="bullet" x="718" y="217">• Free</text>
<text class="bullet" x="718" y="235">• In Depth</text>
<text class="bullet" x="718" y="253">• AI Analyzed</text>
<text class="bullet" x="718" y="271">• Human Led</text>
</a>

<!-- Assess -> Diagnostics (side entry, straight) -->
<path class="flow-line" d="M250,205 C300,200 340,205 375,210"/>
<!-- Assess -> Resources (arcs high above, clears over Diagnostics, no crossing) -->
<path class="flow-line" d="M240,130 C420,10 620,10 760,128"/>

<!-- Improve (links to sima-flow) -->
<a href="https://www.sima360.org/sima-flow">
<rect class="box" x="540" y="400" width="200" height="130" rx="8"/>
<text class="step-label" x="558" y="421">SIMA-FLOW</text>
<text class="step-title" x="558" y="443">Improve</text>
<line class="divider" x1="558" y1="453" x2="712" y2="453"/>
<text class="step-label" x="558" y="471">IMPROVEMENT CYCLES</text>
<text class="bullet" x="558" y="489">• Core Cycle</text>
<text class="bullet" x="558" y="507">• FLAI Cycle</text>
</a>

<!-- Diagnostics -> Improve -->
<path class="flow-line" d="M475,325 C500,360 540,378 570,398"/>
<!-- Resources -> Improve -->
<path class="flow-line" d="M795,290 C760,340 725,370 705,398"/>

<!-- Improve -> bottom of Assess (single smooth arc) -->
<path class="flow-line" d="M540,480 C350,560 -20,440 150,293"/>

<!-- Consulting & Training (links to sima-ascend) -->
<a href="https://www.sima360.org/sima-ascend">
<rect class="boxAlt" x="60" y="580" width="830" height="140" rx="8"/>
<text class="step-label" x="82" y="608">SIMA-ASCEND</text>
<text class="support-title" x="82" y="632">Consulting &amp; Training</text>
<text class="support-sub" x="82" y="654">Delivered by certified practitioners.</text>
<line class="divider" x1="470" y1="598" x2="470" y2="704"/>
<text class="step-label" x="500" y="608">TIERS</text>
<text class="bullet" x="500" y="628">• AI Solutions Agent</text>
<text class="bullet" x="500" y="648">• AI Solutions Orchestrator</text>
<text class="bullet" x="500" y="668">• AI Solutions Strategist</text>
