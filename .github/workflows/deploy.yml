name: Deploy to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build static export
        run: npm run build

      - name: Write counter token
        # counter.php (GET) and counterreset.php both require this file's
        # contents as ?token=. Sourced from a GitHub secret so the value
        # never appears in this public repo's source.
        run: |
          mkdir -p out/assessment-data
          printf '%s' "${{ secrets.COUNTER_TOKEN }}" > out/assessment-data/token.txt

      - name: Deploy to Namecheap via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # count.txt holds the live completion count, written by
          # counter.php on the server — it has no local counterpart, so
          # excluding it stops each deploy from deleting it (the action
          # otherwise mirrors ./out/ exactly). token.txt is NOT excluded:
          # it should sync fresh from the "Write counter token" step above
          # on every deploy.
          exclude: |
            **/assessment-data/count.txt
